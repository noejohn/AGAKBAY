<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual charging indicator wiring</title>
  <desc id="desc">A simplified Heltec board diagram showing the existing USB-C, battery connector, charger LED, charger status signal, ESP32, and OLED. An added signal wire connects the charger status to a protected ESP32 input so firmware can show a charging icon.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#35536b"/></marker>
    <marker id="amberArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e58a17"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183247; }
      .small { font-size: 15px; }
      .label { font-size: 18px; font-weight: 700; }
      .title { font-size: 28px; font-weight: 700; }
      .sub { font-size: 16px; fill: #526777; }
    </style>
  </defs>
  <rect width="1000" height="620" fill="#f4f7fa"/>
  <text x="44" y="52" class="title">How the OLED could show “charging”</text>
  <text x="44" y="82" class="sub">Concept drawing — not to scale; exact solder points vary by board revision.</text>

  <!-- Board outline -->
  <rect x="230" y="130" width="540" height="390" rx="28" fill="#d9eee4" stroke="#39735d" stroke-width="4"/>
  <text x="500" y="157" text-anchor="middle" class="label">Heltec board</text>

  <!-- USB-C -->
  <rect x="202" y="210" width="56" height="72" rx="12" fill="#34495b" stroke="#172a38" stroke-width="3"/>
  <rect x="213" y="229" width="34" height="34" rx="9" fill="#dce3e8"/>
  <text x="120" y="244" text-anchor="end" class="label">USB-C</text>
  <path d="M170 248H202" stroke="#35536b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Charger -->
  <rect x="330" y="205" width="190" height="110" rx="15" fill="#fff" stroke="#527b68" stroke-width="3"/>
  <text x="425" y="247" text-anchor="middle" class="label">Battery charger</text>
  <text x="425" y="274" text-anchor="middle" class="small">TP4054 on V3 schematic</text>
  <path d="M258 246H327" stroke="#35536b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Charge LED -->
  <circle cx="602" cy="238" r="12" fill="#f05d5e" stroke="#a93037" stroke-width="3"/>
  <text x="627" y="233" class="label">Built-in</text>
  <text x="627" y="256" class="small">charge LED</text>
  <path d="M520 236H584" stroke="#35536b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="552" y="218" text-anchor="middle" class="small">existing signal</text>

  <!-- Battery connector and battery -->
  <rect x="331" y="381" width="25" height="38" rx="5" fill="#fff" stroke="#35536b" stroke-width="3"/>
  <text x="342" y="444" text-anchor="middle" class="small">JST</text>
  <rect x="100" y="365" width="150" height="78" rx="12" fill="#fff" stroke="#35536b" stroke-width="3"/>
  <text x="175" y="398" text-anchor="middle" class="label">LiPo battery</text>
  <text x="175" y="423" text-anchor="middle" class="small">3.7 V</text>
  <path d="M250 404H328" stroke="#35536b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M356 400H423V316" fill="none" stroke="#35536b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ESP32 and OLED -->
  <rect x="525" y="365" width="155" height="100" rx="14" fill="#fff" stroke="#527b68" stroke-width="3"/>
  <text x="602" y="405" text-anchor="middle" class="label">ESP32</text>
  <text x="602" y="432" text-anchor="middle" class="small">reads GPIO</text>
  <rect x="715" y="205" width="180" height="125" rx="12" fill="#132b3c" stroke="#0b1d2a" stroke-width="4"/>
  <text x="805" y="237" text-anchor="middle" fill="#fff" class="label">OLED</text>
  <rect x="751" y="258" width="30" height="17" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
  <rect x="782" y="263" width="4" height="7" fill="#fff"/>
  <rect x="754" y="261" width="13" height="11" fill="#fff"/>
  <path d="M770 258L764 267H770L767 275L778 264H772L776 258Z" fill="#ffc44d"/>
  <text x="823" y="273" fill="#fff" class="small">87%</text>
  <text x="805" y="307" text-anchor="middle" fill="#c8d9e4" class="small">bolt appears while charging</text>
  <path d="M680 396H735V330" fill="none" stroke="#35536b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Added signal path -->
  <path d="M500 300V342H495V415H522" fill="none" stroke="#e58a17" stroke-width="5" stroke-dasharray="9 6" marker-end="url(#amberArrow)"/>
  <rect x="365" y="331" width="164" height="54" rx="10" fill="#fff4df" stroke="#e58a17" stroke-width="2"/>
  <text x="447" y="353" text-anchor="middle" class="label" fill="#8a5108">Added signal wire</text>
  <text x="447" y="374" text-anchor="middle" class="small" fill="#8a5108">with safe input interface</text>
  <text x="610" y="493" text-anchor="middle" class="small">The signal wire taps the charger status and goes to a spare GPIO.</text>

  <!-- Legend -->
  <line x1="55" y1="563" x2="105" y2="563" stroke="#35536b" stroke-width="3"/>
  <text x="116" y="569" class="small">existing board connections</text>
  <line x1="380" y1="563" x2="430" y2="563" stroke="#e58a17" stroke-width="5" stroke-dasharray="9 6"/>
  <text x="441" y="569" class="small">additional signal connection</text>
  <text x="55" y="600" class="small" fill="#526777">This drawing explains the idea; it does not identify a confirmed GPIO or solder pad.</text>
</svg>
