<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AGAKBAY Tourism Admin Dashboard.">

  <!--
    Optional Google Maps support for web builds that use GoogleMap widgets.
    The admin dashboard uses OpenStreetMap for its web maps, so it does not
    require this key. Other web builds can copy
    web/maps_config.example.js to web/maps_config.js (gitignored) and provide
    a browser Maps key restricted to their allowed HTTP referrers.
  -->
  <script src="maps_config.js"></script>
  <script>
    // Start Flutter only after the Maps JS API has loaded (or failed), so
    // a GoogleMap widget never builds before `google.maps` exists — that
    // race renders as a blank gray box in release builds.
    window.agakbayStartFlutter = function () {
      if (window.__agakbayFlutterStarted) return;
      window.__agakbayFlutterStarted = true;
      var b = document.createElement("script");
      b.src = "flutter_bootstrap.js";
      b.async = true;
      document.body.appendChild(b);
    };
    (function () {
      var key = window.AGAKBAY_MAPS_API_KEY;
      if (!key) {
        console.info("Google Maps key missing; GoogleMap widgets are unavailable. Admin dashboard maps use OpenStreetMap.");
        window.__agakbayMapsReady = true;
        return;
      }
      var s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key);
      s.async = true;
      s.onload = s.onerror = function () {
        window.__agakbayMapsReady = true;
        if (document.body) window.agakbayStartFlutter();
      };
      document.head.appendChild(s);
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AGAKBAY Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="animal.png"/>

  <title>AGAKBAY Admin Dashboard</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if (window.__agakbayMapsReady) window.agakbayStartFlutter();
  </script>
</body>
</html>
