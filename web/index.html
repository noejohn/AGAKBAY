<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AGAKBAY Tourism Admin Dashboard.">

  <!--
    Required for google_maps_flutter's web implementation (used by the
    Trail Route Verification page). The key is NOT committed: copy
    web/maps_config.example.js to web/maps_config.js (gitignored) and put
    a web Maps key there. Flutter copies it into build/web, so it ships
    with the Vercel deploy. Restrict that key in Google Cloud Console
    (APIs & Services > Credentials) by HTTP referrer
    (https://agakbay.vercel.app/*, http://localhost:3000/*) and to the
    Maps JavaScript API only.
  -->
  <script src="maps_config.js"></script>
  <script>
    (function () {
      var key = window.AGAKBAY_MAPS_API_KEY;
      if (!key) {
        console.warn("Google Maps key missing: create web/maps_config.js (see maps_config.example.js).");
        return;
      }
      var s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key);
      s.defer = true;
      document.head.appendChild(s);
    })();
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AGAKBAY Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="animal.png"/>

  <title>AGAKBAY Admin Dashboard</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
