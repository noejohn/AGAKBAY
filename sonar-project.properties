sonar.projectKey=noejohn_AGAKBAY
sonar.organization=noejohn

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=AGAKBAY
sonar.projectVersion=1.0

# Scoped to the Cloud Functions (Node.js/JS) code for now — SonarCloud's
# Dart/Flutter support isn't confirmed, and scanning it would need a
# Flutter SDK build step in the workflow first. Add "lib" back to
# sonar.sources once that's verified to work.
sonar.sources=functions
sonar.exclusions=functions/node_modules/**,functions/coverage/**
sonar.tests=functions
sonar.test.inclusions=functions/**/*.test.js

sonar.javascript.lcov.reportPaths=functions/coverage/lcov.info

sonar.sourceEncoding=UTF-8
